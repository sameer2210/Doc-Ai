name: Swagger Docs Deploy

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/spandavidya
      DIRECT_URL: postgres://postgres:postgres@localhost:5432/spandavidya
      JWT_SECRET: test_jwt_secret
      JWT_REFRESH_SECRET: test_refresh_secret
      JWT_EXPIRES_IN: 3600s
      JWT_REFRESH_EXPIRES_IN: 7d
      GEMINI_DAILY_LIMIT: 30
      PORT: 8080
      GOOGLE_API_KEY: test_google_api_key
      GOOGLE_GEMINI_MODEL: gemini-2.5-flash
      AWS_ACCESS_KEY_ID: test_access_key
      AWS_SECRET_ACCESS_KEY: test_secret_key
      AWS_REGION: ap-south-1
      AWS_S3_BUCKET_NAME: spandavidya-docs
      HUGGINGFACE_API_URL: https://sameer2210-cataractaiml.hf.space/predict
      ML_GATEWAY_TIMEOUT_MS: 60000
      ML_GATEWAY_MAX_RETRIES: 0

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Swagger docs
        run: npm run prisma:generate

      - name: Generate Swagger Documentation
        run: npm run generate:docs

      - name: Copy Swagger UI
        run: |
          mkdir -p docs
          cp -r node_modules/swagger-ui-dist/* docs
          cp docs/swagger.json docs/swagger-initializer.json
          echo "window.onload = function() {
            window.ui = SwaggerUIBundle({
              url: 'swagger.json',
              dom_id: '#swagger-ui',
              presets: [
                SwaggerUIBundle.presets.apis,
                SwaggerUIStandalonePreset
              ],
              layout: 'BaseLayout',
              deepLinking: true
            });
          };" > docs/swagger-initializer.js

      - name: Deploy Swagger Docs to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: backend/docs
          publish_branch: gh-pages
