name: Swagger Docs Deploy

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/spandavidya
      JWT_SECRET: test_jwt_secret
      JWT_REFRESH_SECRET: test_refresh_secret
      JWT_EXPIRES_IN: 3600s
      JWT_REFRESH_EXPIRES_IN: 7d
      PORT: 8000

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Swagger docs
        working-directory: backend
        run: npx prisma generate

      - name: Generate Swagger Documentation
        working-directory: backend
        run: npm run generate:docs

      - name: Copy Swagger UI
        working-directory: backend
        run: |
          mkdir -p docs
          cp -r node_modules/swagger-ui-dist/* docs
          cp docs/swagger.json docs/swagger-initializer.json
          echo "window.onload = function() {
            window.ui = SwaggerUIBundle({
              url: 'swagger.json',
              dom_id: '#swagger-ui',
              presets: [
                SwaggerUIBundle.presets.apis,
                SwaggerUIStandalonePreset
              ],
              layout: 'BaseLayout',
              deepLinking: true
            });
          };" > docs/swagger-initializer.js

      - name: Deploy Swagger Docs to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
